# Regions for pilot station selection (spec §8.3).
# A region is defined by `countries` (ISD/FIPS country codes), a lat/lon box, or both.
# Assignment: country lists first (a station in a listed country belongs to that region wherever it is),
# then boxes in the order listed (first match wins). lat: degrees north, lon: degrees east; bounds inclusive.
# target_n = stations wanted per region in the pilot (plus 10 contrast stations chosen by hand:
# Canary Islands/Cabo Verde, Korea/Japan, Caribbean, US METAR stations).
regions:
  - name: North Africa
    note: Sahara and Sahel
    lat: [12, 37]
    lon: [-18, 35]
    target_n: 15
  - name: Middle East
    note: box only; Afghanistan and Pakistan are taken first by their country lists
    lat: [12, 40]
    lon: [35, 63]
    target_n: 15
  - name: Central Asia
    note: Kazakhstan, Uzbekistan, Turkmenistan, Tajikistan, Kyrgyzstan, Afghanistan
    countries: [KZ, UZ, TX, TI, KG, AF]
    target_n: 12
  - name: South Asia
    note: Pakistan, India, Bangladesh, Nepal (Thar Desert, Indus and Ganges plains)
    countries: [PK, IN, BG, NP]
    target_n: 8
  - name: East Asia
    note: all of China (incl. Taklimakan) and Mongolia (Gobi)
    countries: [CH, MG]
    target_n: 15
  - name: Southern Africa
    note: Namib and Kalahari
    lat: [-35, -15]
    lon: [10, 30]
    target_n: 8
  - name: North America
    note: US Southwest and northern Mexico
    lat: [25, 42]
    lon: [-125, -100]
    target_n: 10
  - name: South America
    note: Patagonia, Monte, Chaco, Atacama
    lat: [-55, -15]
    lon: [-75, -55]
    target_n: 8
  - name: Australia
    lat: [-40, -15]
    lon: [113, 154]
    target_n: 7
