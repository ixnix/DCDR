# DCDR default configuration. Every method choice in the spec is a key here.
#
# Loaded by config.load_settings() and validated by the classes in config.py (a typo or an unknown
# key stops the run with an error). Override any key with `--profile my.yaml` (only the keys it
# names), and the data location with the DCDR_DATA environment variable.
# Changing a key under parse/qc/classify/sampling changes the silver config hash, so the next run
# rebuilds silver; gold refuses silver built with different settings.

paths:
  data_root: data  # relative to the working directory; set DCDR_DATA or a profile to use another disk

ingest:
  bucket: noaa-global-hourly-pds  # NOAA's public S3 bucket: <year>/<station_id>.csv
  region: us-east-1
  max_concurrency: 16  # parallel downloads
  retries: 5  # attempts per file before it is marked failed
  checkpoint_every: 500  # save the download record and log progress every 500 files

parse:
  gust_od_types: [3, 4]  # OD supplementary-wind types that are gusts (ISD format document)

qc:
  # ISD quality codes attached to each value. 0/1/4/5/9: passed NOAA's checks (4-7: ASOS/AWOS
  # data); 2/6: suspect; 3/7: erroneous; A/C/I/M/P/R/U: accepted, corrected or inserted by
  # NOAA's validators. Unknown codes are treated as suspect.
  codes_ok: ["0", "1", "4", "5", "9", "A", "C", "I", "M", "P", "R", "U"]
  codes_suspect: ["2", "6"]
  codes_erroneous: ["3", "7"]
  accept: [ok]  # flags a value may have and still be used (add "suspect" to be more lenient)
  vis_cap_m: 10000  # cap visibility at 10 km (stations report "unlimited" differently)
  rh_screen_pct: 90  # above this relative humidity ...
  rh_screen_classes: [suspended, haze, haze_or_suspended, dust_haze]  # ... these classes are screened

classify:
  fields: [MW, AU, AW]  # present-weather families used (manual, METAR-style, automated)
  haze_window_h: 24  # haze within 24 h after a dust report counts as dust (0 switches it off)
  sand_min_t_c: 3.0  # "blowing snow or sand" codes count as sand at or above this temperature
  snow_max_t_c: 0.0  # ... and as snow at or below this; in between they are flagged ambiguous
  # SYNOP iX indicator (WMO code table 1860), read from the raw message in REM: iX 2/5 = weather
  # group omitted because nothing significant happened (observed: no dust); iX 3/6 = not observed;
  # iX 7 = automatic station using WMO tables 4680/4531. false = ignore iX (missing = not observed).
  synop_ix: true
  # Rule V3 (validated in notebooks/02, precision 0.9998): a SYNOP with no weather code and no iX
  # but with visibility reported is "nothing significant, inferred" (pw_status nil_inferred) if
  # its station passes the guard: in the station's iX years, < 2 % of omitted groups with
  # visibility were "not observed" (iX 3/6), judged on >= 50 such reports. Stations without
  # enough iX evidence get no inference.
  infer_nil: true
  infer_nil_report_types: [FM-12]
  nil_guard_max_share: 0.02
  nil_guard_min_reports: 50
  # METAR/SPECI (validated in notebooks/03; user decisions 2026-10-20). A METAR fills a slot only
  # when no SYNOP does. AUTO reports and "//" are not observed (machines cannot detect dust);
  # CAVOK is "nothing significant"; a non-AUTO METAR without a weather group is "nothing
  # significant, implied" (pw_status nil_metar) only if visibility > 5 km: at <= 5 km WMO
  # requires DU/SA/HZ/BR to be coded, so an empty group there means something went unnamed.
  metar_rules: true
  metar_report_types: [FM-15, FM-16]
  metar_nil_min_vis_m: 5000
  # METARs without full text (before 2000 ISD keeps only fragments; validated in notebooks/06): no
  # code and visibility > 5 km -> "nothing significant, inferred" (pw_status nil_inferred) if the
  # station's full-text METARs show < 2 % "not observed" among such reports (>= 50 reports).
  # A CAVOK in a fragment (before any trend word) is read as explicit "nothing significant".
  metar_infer_nil: true
  metar_nil_guard_max_share: 0.02
  metar_nil_guard_min_reports: 50
  # Derived SYNOPs (US since ~2005, notebooks/06): in a station-year whose SYNOPs copy the METAR
  # just before them (temperature >= 95 % and wind speed >= 80 % identical, >= 100 pairs), the
  # SYNOP's present weather is not used: dust and validity come from the METAR.
  derived_synop: true
  derived_report_types: [FM-12]
  derived_min_pairs: 100
  derived_max_minutes: 15
  derived_t_share: 0.95
  derived_wind_share: 0.80

sampling:
  window_min: 30  # a report within +-30 min of a synoptic hour (00, 03, ..., 21 UTC) is a candidate
  exclude_types: [SOD, SOM]  # daily and monthly summaries are not observations at a time
  # Slot sources (user decision 2026-10-20). Each slot takes at most ONE report per source: the
  # closest one that observed the weather (types listed first are preferred). A slot is dusty if
  # either source reports dust; its primary report (wind, temperature, visibility means) is the
  # SYNOP if it observed the weather, otherwise the METAR. SPECI (FM-16) never fill a slot: they
  # are sent because conditions changed, often when dust arrives; they count in dusty_day_any.
  sources:
    synop: [FM-12, SY-MT, SY-SA, SY-AE, SY-AU]
    metar: [FM-15, SAO, AUTO]

products:
  min_slots_per_day: 4  # a day is valid with >= 4 of 8 slots carrying a weather observation
  # dusty_day_vis5: dust that reduced visibility to <= 5 km (the METAR limit, WMO FM 15.8.12),
  # caught equally by SYNOP and METAR; used to compare stations and years with mixed reports.
  vis5_max_m: 5000
  gold_keep_versions: 3  # old gold versions kept on disk (for rollback)

stations:
  station_list: config/stations/pilot_100.csv  # default for --stations (relative to working dir)
